name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            container: ""
          - name: rockylinux8
            container: "rockylinux:8"
          - name: rockylinux9
            container: "rockylinux:9"

    steps:
      - name: Install system dependencies (Rocky Linux)
        if: matrix.container != ''
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb 2>/dev/null || dnf config-manager --set-enabled powertools 2>/dev/null || true
          dnf config-manager --set-enabled devel
          dnf install -y clang-devel glib2-devel wireshark-devel

      - name: Install system dependencies (Ubuntu)
        if: matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev libglib2.0-dev libwireshark-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --features bindgen

      - name: Test
        run: cargo test --features bindgen
